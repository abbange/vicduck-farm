<meta charset="utf-8">
<title>오리 농장</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 3D 농장: 위 자원·상태 줄, 왼쪽 목표, 왼쪽 아래 조이스틱, 오른쪽 아래 점프·줄서·짓기 */
[hidden]{display:none!important}
:root{
  --ink:#1F2A33; --muted:#5C6B75; --glass:rgba(255,255,255,.9); --dark:rgba(24,28,32,.72);
  --yellow:#FFD23F; --green:#3DBA54; --red:#E5483B; --blue:#2D8CE6; --line:#E3E6EA;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#8FCBF0;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.bar{display:flex;gap:6px;align-items:center}
.res{pointer-events:auto;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.res::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;display:flex;align-items:center;gap:4px;background:var(--glass);border-radius:999px;padding:4px 10px;font-size:15px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.12);font-variant-numeric:tabular-nums;transition:transform .15s}
.chip.bump{transform:scale(1.18)}
.chip.dark{background:var(--dark);color:#fff;box-shadow:none}
.chip.warn{background:#FFE0DC;color:#B42318}
button.chip{border:0;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.quest{pointer-events:auto;align-self:flex-start;background:var(--dark);color:#fff;border-radius:12px;padding:7px 11px;max-width:min(330px,70vw);font-size:14px;line-height:1.35;
  border-left:5px solid var(--yellow)}
.quest .t{font-size:11.5px;color:#FFE38A;letter-spacing:.04em}
.quest .p{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:12.5px;color:#D6DCE0}
.banner{align-self:center;background:#fff;font-size:18px;padding:7px 18px;border-radius:999px;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);max-width:92%;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.spacer{flex:1}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.joy{pointer-events:auto;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.75);position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.acts .row{display:flex;gap:8px;align-items:flex-end}
.btn{pointer-events:auto;font-family:var(--font);border:0;cursor:pointer;color:var(--ink);background:var(--glass);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:focus-visible,.mbtns button:focus-visible,button.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.s{width:60px;height:60px;border-radius:18px;font-size:12px}
.btn.s .e{font-size:22px}
.btn.jump{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:14px}
.btn.jump .e{font-size:30px}
.btn.on{background:var(--yellow)}
.btn.big{min-width:150px;height:64px;border-radius:18px;font-size:17px;background:var(--yellow);padding:0 16px}
.btn.big.no{background:#E4E6E8;color:var(--muted)}
.btn.shoo{min-width:120px;height:64px;border-radius:18px;font-size:16px;background:#FF9F6B;color:#fff;padding:0 14px}
.btn.pulse{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.modal{position:fixed;inset:0;background:rgba(15,20,25,.5);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px))}
.card{background:#fff;border-radius:20px;max-width:480px;width:100%;max-height:86vh;overflow:auto;padding:18px 18px 14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);animation:rise .2s ease-out;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;-webkit-user-select:text;user-select:text}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--font);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
.card h3{font-family:var(--font);font-weight:400;font-size:17px;margin:12px 0 4px}
.card p{margin:6px 0}
.card .eyebrow{font-family:var(--font);font-size:13px;color:var(--blue)}
.card .note{background:#EEF6FD;border-radius:12px;padding:9px 12px;font-size:14px}
.card .fact{background:#FFF7DA;border-radius:12px;padding:9px 12px;font-size:14px}
.card .src{font-size:12.5px;color:var(--muted)}
.card ul{padding-left:18px;margin:6px 0}
.card textarea{width:100%;box-sizing:border-box;min-height:150px;font:inherit;font-size:15px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;margin:4px 0;resize:vertical}
.card input[type=number],.card input[type=password]{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:140px}
.tabs{display:flex;gap:6px;margin:8px 0 2px;flex-wrap:wrap}
.tabs button{font-family:var(--font);font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow)}
.item .big{font-size:30px;line-height:1}
.item .ok{font-size:12px;color:#1F7A35}
.bag{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:center;font-size:14px}
.bag .e{font-size:22px}.bag b{font-variant-numeric:tabular-nums}.bag .w{color:var(--muted);font-size:12.5px}
.qword{font-family:var(--font);font-size:38px;text-align:center;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.say{font-size:22px;border:2px solid var(--line);background:#fff;border-radius:999px;width:46px;height:46px;cursor:pointer}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.qopts button{font-family:var(--font);font-size:18px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;cursor:pointer;color:var(--ink)}
.qopts button.right{background:#DDF5E2;border-color:#3DBA54}.qopts button.wrong{background:#FFE0DC;border-color:#E5483B}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;min-height:44px}
.tiles button{font-size:17px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-family:system-ui,sans-serif}
.tiles.ans{background:#F4F6F8;border-radius:12px;padding:6px}
.qbar{height:8px;background:#EEF0F2;border-radius:9px;overflow:hidden;margin:4px 0 2px}.qbar i{display:block;height:100%;background:var(--green)}
.qtext{font-size:18px;line-height:1.5;margin:8px 0;background:#F7F9FB;border-radius:12px;padding:10px 12px}
.qtext .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);font-weight:700}
.qins{display:flex;gap:8px;flex-wrap:wrap}.qins input{flex:1 1 120px}
.res-ok{color:#1F7A35;font-weight:700}.res-no{color:#B42318;font-weight:700}
button.chip.hw{background:var(--yellow)}
.card input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;margin:4px 0}
.card input[type=text]:focus{outline:none;border-color:var(--blue)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opts button{font:inherit;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer}
.opts button[aria-pressed=true]{border-color:var(--ink);background:#F4F6F8}
.sw{width:38px;height:38px;border-radius:50%!important;padding:0!important}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.item{border:2px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.item:disabled{cursor:default;opacity:.55}
.item.armed{border-color:#F2B632;background:#FFF6D6;box-shadow:0 0 0 3px rgba(242,182,50,.35)}.tabs [aria-pressed="true"]{background:#FFD23F;border-color:#F2B632}.item .cf{font-size:12.5px;font-weight:700;color:#B5730B}
.item .n{font-family:var(--font);font-size:16px}
.item .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.cost{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px}
.cost span{background:#F1F3F5;border-radius:999px;padding:1px 7px}
.cost span.lack{background:#FFE0DC;color:#B42318}
.stat{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;margin:6px 0}
.stat b{font-weight:600}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mbtns button{flex:1 1 auto;font-family:var(--font);font-size:16px;border-radius:12px;padding:10px 14px;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink)}
.mbtns button.primary{background:var(--yellow);border-color:var(--yellow)}
.mbtns button:disabled{opacity:.45;cursor:default}
.mbtns button.danger{color:var(--red);border-color:#F5C2BC}
.fade{position:fixed;inset:0;background:#0E1730;opacity:0;pointer-events:none;transition:opacity .8s;z-index:15;display:flex;align-items:center;justify-content:center;color:#FFF3C4;font-family:var(--font);font-size:32px}
.fade.on{opacity:1;pointer-events:auto}
.mini{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(max(8px,env(safe-area-inset-top,0px)) + 46px);width:112px;height:112px;border-radius:14px;background:rgba(20,28,34,.55);
  box-shadow:0 2px 10px -4px rgba(0,0,0,.4);pointer-events:auto;cursor:pointer;border:2px solid rgba(255,255,255,.7)}
.bigmap{width:100%;max-width:420px;aspect-ratio:1;border-radius:16px;display:block;margin:6px auto;background:#1E2A30}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
body.inroom .status,body.inroom .quest,body.inroom .mini,body.inroom .joy{display:none!important}
.alarm{text-align:center}.alarm .big{font-size:64px;line-height:1;margin:6px 0;animation:pulse 1s ease-in-out infinite}
.rlist li{margin:6px 0}.rlist .src{display:block}
@media (max-width:430px){.mini{width:92px;height:92px}.chip{font-size:13px;padding:3px 8px}.joy{width:108px;height:108px}.btn.s{width:54px;height:54px}.btn.jump{width:76px;height:76px}.quest{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="cv" tabindex="0" aria-label="오리 농장 화면"></canvas>
<div class="hud">
  <div class="bar"><span class="chip dark" id="hDay">1일째 07:00</span><div class="res" id="res"></div><button class="chip" id="bAv" aria-label="내 옷장">👗</button><button class="chip" id="bBag" aria-label="가방">🎒</button><button class="chip" id="bVoc" aria-label="내 단어장">📖</button><button class="chip" id="bHw" aria-label="숙제">📚</button><button class="chip" id="bShop" aria-label="상점">🛒</button><button class="chip" id="bDex" aria-label="오리 도감">📒</button><button class="chip" id="bMenu" aria-label="메뉴">☰</button></div>
  <div class="status" id="status"></div>
  <div class="quest" id="quest"></div>
  <div id="banner" class="banner" hidden></div>
  <div class="spacer"></div>
  <canvas class="mini" id="mini" width="224" height="224" aria-label="농장 지도"></canvas>
  <div class="bottom">
    <div class="joy" id="joy" aria-label="움직이기"><div class="knob" id="knob"></div></div>
    <div class="acts" id="acts"></div>
  </div>
</div>
<div class="fade" id="fade">쿨쿨… 좋은 꿈 꿔</div>
<div id="modal" class="modal" hidden><div class="card" role="dialog" aria-modal="true"><div id="mBody"></div><div id="mBtns" class="mbtns"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){document.body.innerHTML='<p style="padding:20px;font-family:sans-serif">3D 엔진을 불러오지 못했어요. 새로고침해 주세요.</p>';return;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const C=h=>new THREE.Color(h).convertSRGBToLinear();
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function batchim(s){const c=s.charCodeAt(s.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function josa(s,a,b){return s+(batchim(s)?a:b);}
const FAST=clamp(+(new URLSearchParams(location.search).get('fast')||1),1,40);

/* ================= 저장 ================= */
const KEY='duck-farm-v1';
function INIT_PLOTS(){const a=[];for(let x=1;x<=4;x++)for(let z=1;z<=4;z++)a.push(x+','+z);return a;}
const DEF=()=>({v:1,started:false,girl:'',hair:'pig',hairC:'#4A2E22',dress:'#FF7FA8',day:1,clock:7*60,
  res:{coin:100,grain:0,straw:6,feed:40,egg:0,twig:4,rock:4,feather:2,weed:0,gem:0},eggs:[],bld:[],ducks:[],q:0,seen:{},cnt:{},dex:{pekin:1},nid:1,
  autoSell:true,clean:100,g24:true,plots:INIT_PLOTS(),shoo:0,lastSeason:0,today:{laid:0,sold:0,coins:0,hatched:0,feed:0},unlock:{runner:false,call:false,muscovy:false},paraded:0});
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1){if(!o.g24){(o.bld||[]).forEach(b=>{b.i+=4;b.j+=4;});o.g24=true;o.plots=INIT_PLOTS();}const d=DEF();Object.assign(d,o);d.res=Object.assign(DEF().res,o.res);return d;}}}catch(e){}return DEF();}
let leaving=false;function save(){if(leaving)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
// 💾 저장: 이 기기(자동, 5초마다) + 클라우드(같은 Claude 계정으로 여는 모든 기기, 2분마다·저장 버튼)
let lastCloud=0,cloudAcc=0;const hhmm=t=>{const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');};
const MYDEV=(()=>{try{let d=localStorage.getItem(KEY+'-dev');if(!d){d=Math.random().toString(36).slice(2,10);localStorage.setItem(KEY+'-dev',d);}return d;}catch(e){return 'x';}})();
let cloudBusy=false;
async function cloudSave(){if(!DB||!S.started||cloudBusy)return false;cloudBusy=true;try{
  // 다른 기기가 더 최근에 저장했으면 덮어쓰지 않아요(아이가 하던 게임을 부모 기기가 지우지 않게)
  try{const sn=await DB.doc('save/main').get();const d=sn&&sn.exists?sn.data():null;if(d&&d.dev&&d.dev!==MYDEV&&d.at>(S.savedAt||0)+1000){if(!cloudWarned){cloudWarned=true;banner('☁️ 다른 기기에서 게임 중이라 이 기기 저장은 클라우드에 올리지 않아요');}return false;}}catch(e){}
  const at=Date.now();S.savedAt=at;save();return await DB.doc('save/main').set({data:JSON.stringify(S),at,day:S.day,girl:S.girl||'',ducks:(S.ducks||[]).length,dev:MYDEV}).then(r=>{if(r===false)return false;lastCloud=at;return true;}).catch(()=>false);}finally{cloudBusy=false;}}
let cloudWarned=false;
function saveNow(show){save();cloudSave().then(ok=>{if(show)banner(ok?'💾 저장했어요! (이 기기 + 클라우드) '+hhmm(Date.now()):'💾 이 기기에 저장했어요 '+hhmm(Date.now()));});}
function cloudTick(dt){cloudAcc+=dt;if(cloudAcc>120){cloudAcc=0;cloudSave();}}
function cloudLoadCard(){if(!DB){modal('<p class="eyebrow">부모님 메뉴</p><h2>☁️ 불러오기</h2><p>지금 화면에서는 클라우드 저장소를 쓸 수 없어요. 게임 링크(claude.ai)로 열었을 때 쓸 수 있어요.</p>');return;}
  DB.doc('save/main').get().then(sn=>{const d=sn&&sn.exists?sn.data():null;if(!d||!d.data){modal('<p class="eyebrow">부모님 메뉴</p><h2>☁️ 불러오기</h2><p>클라우드에 저장된 게임이 아직 없어요.</p>');return;}
    modal('<p class="eyebrow">부모님 메뉴</p><h2>☁️ 클라우드 저장 불러오기</h2><p><b>'+esc(d.girl||'')+'</b> · '+d.day+'일째 · 오리 '+d.ducks+'마리<br><span class="src">저장한 때: '+new Date(d.at).toLocaleString('ko-KR')+'</span></p><p class="note">지금 이 기기의 게임('+S.day+'일째, 오리 '+(S.ducks||[]).length+'마리)은 이 저장으로 바뀌어요.</p>',
      [{t:'불러오기',cls:'primary',keep:true,fn:(el)=>{if(!el.dataset.c){el.dataset.c=1;el.textContent='👆 정말 바꿀까요? 한 번 더 누르기';return;}try{localStorage.setItem(KEY+'-before-load',JSON.stringify(S));localStorage.setItem(KEY,d.data);}catch(e){}(leaving=true,location.reload());}},{t:'닫기'}]);}).catch(()=>modal('<h2>불러오지 못했어요</h2><p>잠시 뒤 다시 해 주세요.</p>'));}
function moveCard(){const code='DUCK1:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  modal('<p class="eyebrow">👩 부모님 메뉴</p><h2>📦 저장 옮기기</h2><p class="src">인터넷 연결 없이도 다른 주소·기기로 게임을 옮길 수 있어요. ① 이 기기에서 <b>복사</b> → ② 새 기기(또는 새 주소)에서 부모님 메뉴 → 저장 옮기기 → 아래 칸에 <b>붙여넣기</b> → 가져오기.</p><textarea id="mvTx" rows="4" style="width:100%;font-size:11px" placeholder="여기에 붙여넣기">'+'</textarea><div id="mvMsg" class="src"></div>',
    [{t:'📋 이 기기 저장 복사',cls:'primary',keep:true,fn:()=>{const t=$('#mvTx');t.value=code;t.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}(navigator.clipboard?navigator.clipboard.writeText(code).then(()=>true,()=>ok):Promise.resolve(ok)).then(v=>{$('#mvMsg').textContent=v?'복사했어요! 새 기기에서 붙여넣어 주세요.':'칸에 나온 글자를 길게 눌러 전체 복사해 주세요.';});}},

function duckLook(r){const d=r.d,br=BREED[d.b],a=d.age,young=a<49;const s=lerp(0.5,1,clamp(a/49,0,1))*br.size*0.34;r.m.g.scale.setScalar(s);

const bldR=new Map();   // id → {d,g,R}
let ducks=[];           // {d,m,x,z,yaw,...}
const occ=new Array(N*N).fill(0);
const girl={x:0,z:3,y:0,vy:0,yaw:Math.PI,trail:[],moving:false};
let place=null,parade=0,paradeAuto=false,T=0,scene_='play',modalOpen=false,pickups=[],eggsW=[],pops=[];
function seedTrail(){girl.trail=[];for(let k=90;k>0;k--)girl.trail.push({x:girl.x-Math.sin(girl.yaw)*k*0.15,z:girl.z-Math.cos(girl.yaw)*k*0.15});}
function cellsOf(t,i,j){const f=CAT[t].fp,o=[];for(let a=0;a<f;a++)for(let c=0;c<f;c++)o.push([i+a,j+c]);return o;}
function pondCell(i,j){const c=cellC(i,j);return Math.hypot(c.x-POND.x,c.z-POND.z)<POND.r+0.5;}
function rebuildOcc(){occ.fill(0);for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(pondCell(i,j))occ[i*N+j]=-1;S.bld.forEach(b=>cellsOf(b.t,b.i,b.j).forEach(c=>{occ[c[0]*N+c[1]]=b.id;}));}
function canPlace(t,i,j){return cellsOf(t,i,j).every(c=>c[0]>=0&&c[1]>=0&&c[0]<N&&c[1]<N&&occ[c[0]*N+c[1]]===0&&owned(c[0],c[1]));}
function bCenter(b){const f=CAT[b.t].fp;return{x:b.i*TILE-HALF+f*TILE/2,z:b.j*TILE-HALF+f*TILE/2};}
function spawnB(b){if(bldR.has(b.id)){scene.remove(bldR.get(b.id).g);}const m=buildModel(b),c=bCenter(b);m.g.position.set(c.x,0,c.z);m.g.traverse(o=>{if(o.isMesh)o.userData.bid=b.id;});scene.add(m.g);bldR.set(b.id,{d:b,g:m.g,R:m.R});buildCL();}
function addB(t,i,j,tier){const b={id:S.nid++,t,tier:tier||0,i,j,st:{}};if(t==='field')b.st={stage:'empty',t:0};if(t==='mill')b.st={p:0};if(t==='nest')b.st={eggs:[]};if(t==='incub')b.st={eggs:[]};S.bld.push(b);rebuildOcc();spawnB(b);return b;}
function removeB(b){scene.remove(bldR.get(b.id).g);bldR.delete(b.id);S.bld=S.bld.filter(x=>x!==b);rebuildOcc();buildCL();}
const byT=t=>S.bld.filter(b=>b.t===t);
function capOf(t){return byT(t).reduce((s,b)=>s+CAT[t].cap[b.tier],0);}
function newDuck(b,sex,age,hero){const d={id:S.nid++,b,sex,age,hero:!!hero,health:85};S.ducks.push(d);addDuckR(d);S.dex[b]=1;return d;}
function addDuckR(d){const r={d,m:makeDuck(d),x:0,z:0,yaw:Math.random()*6,wt:0,tx:0,tz:0,act:null,inside:false,featherT:rnd(60,140),sitT:0};const h=byT('duckhouse')[0];const c=h?bCenter(h):{x:0,z:0};r.x=c.x+rnd(-2,2);r.z=c.z+rnd(1.5,3);duckLook(r);ducks.push(r);return r;}

function newGame(){S=DEF();plotSet=new Set(S.plots);refreshPlots();addB('home',5,5);addB('duckhouse',10,5);addB('feeder',9,9);addB('water',10,9);addB('field',5,10);addB('mill',8,11);
  newDuck('pekin','f',146,true);newDuck('pekin','f',158);newDuck('pekin','m',165);newDuck('pekin','f',24);const c=bCenter(S.bld[0]);girl.x=c.x;girl.z=c.z+3;seedTrail();}

/* ================= 농장 톱니바퀴 ================= */
function adults(){return S.ducks.filter(d=>d.age>=49);}
function decoScore(){return (byT('flower').length+byT('bench').length+byT('lamp').length+byT('tree').length)*2+byT('path').length*0.5+byT('statue').length*6;}
function farm(){const n=S.ducks.length,fc=capOf('feeder'),wc=capOf('water'),hc=capOf('duckhouse');const fed=S.res.feed>0&&fc>=n,watered=Math.floor(wc*season().water)>=n,sheltered=hc>=n,clean=S.clean>=40;
  const deco=Math.min(18,decoScore());
  const target=clamp(100-(fed?0:30)-(watered?0:25)-(sheltered?0:20)-(clean?0:20)+deco,0,100);
  const avg=n?S.ducks.reduce((s,d)=>s+d.health,0)/n:0;return{n,fc,wc,hc,fed,watered,sheltered,clean,target,avg};}
const GM_PER_S=4;          // 게임 시간: 1초 = 4분
const AGE_PER_GMIN=6/1440; // 게임 하루 = 오리 나이 6일
function tick(dt){const gm=dt*GM_PER_S*FAST;S.clock+=gm;const F=farm();
  const nA=S.ducks.filter(d=>d.age>=49).length,nY=S.ducks.length-nA,use=(nA*4+nY*2)/960*gm;if(S.res.feed>0){const u=Math.min(S.res.feed,use);S.res.feed-=u;S.today.feed+=u;}
  S.clean=Math.max(0,S.clean-S.ducks.length*6/960*gm*season().clean);
  S.ducks.forEach(d=>{const was=d.age;d.age+=AGE_PER_GMIN*gm;d.health+=clamp(F.target-d.health,-1,1)*Math.min(Math.abs(F.target-d.health),20/960*gm*3);if(was<49&&d.age>=49){const r=ducks.find(x=>x.d===d);if(r)r.dirty=true;}
    if(was<150&&d.age>=150&&d.sex==='f'&&!S.seen.eggAge){S.seen.eggAge=1;fact('알 낳을 나이가 됐어요','<p>'+josa(duckName(d),'이','가')+' 알을 낳을 만큼 컸어요.</p><p class="fact">실제 오리는 생후 <b>5~6개월</b> 즈음부터 알을 낳기 시작해요. 게임 속 시간은 실제보다 훨씬 빨리 흘러요.</p>');}});
  // 알 낳기: 아침(6~11시), 건강 70 이상 암컷, 하루 한 번까지
  const h=S.clock/60;if(h>=6&&h<11){S.ducks.forEach(d=>{if(d.sex==='f'&&d.age>=150&&d.health>=70&&d.laidDay!==S.day&&Math.random()<dt*FAST*0.06*season().lay){d.laidDay=S.day;layEgg(d);}});}
  // 방앗간
  byT('mill').forEach(b=>{const r=bldR.get(b.id);if(S.res.grain>=2){b.st.p+=dt*FAST/CAT.mill.rate[b.tier];if(r.R.hub)r.R.hub.rotation.z-=dt*2.5;if(b.st.p>=1){b.st.p=0;S.res.grain-=2;add('feed',3,bCenter(b),2.6);}}});
  // 밭
  byT('field').forEach(b=>{if(b.st.stage==='grow'){b.st.t+=dt*FAST*season().grow;if(b.st.t>=CAT.field.grow[b.tier])b.st.stage='ripe';}cropLook(b);});
  // 부화기
  byT('incub').forEach(b=>{const r=bldR.get(b.id);r.R.light.material.emissiveIntensity=b.st.eggs.length?0.8+0.4*Math.sin(T*4):0.1;b.st.eggs.forEach(e=>{e.t+=dt*FAST;});
    const done=b.st.eggs.find(e=>e.t>=CAT.incub.time[b.tier]*(e.b==='muscovy'?1.25:1));if(done){if(S.ducks.length<capOf('duckhouse')){b.st.eggs.splice(b.st.eggs.indexOf(done),1);hatch(done.b,bCenter(b));}else if(!b.st.full){b.st.full=1;banner('오리집이 꽉 차서 부화를 기다려요');}}else b.st.full=0;eggVis(b);});
  // 알 가게
  stallT-=dt*FAST;if(stallT<=0){stallT=25;const st=byT('stall');if(st.length&&S.autoSell){let reserve=byT('incub').reduce((s,b)=>s+CAT.incub.slots[b.tier]-b.st.eggs.length,0);st.forEach(b=>{const n=Math.min(CAT.stall.batch[b.tier],Math.max(0,S.res.egg-reserve));if(n>0){for(let i=0;i<n;i++)S.eggs.pop();S.res.egg-=n;const c=n*CAT.stall.price[b.tier];add('coin',c,bCenter(b),2.6);S.today.sold+=n;S.today.coins+=c;cnt('sold',n);ching();}});}}
  // 포근 둥지 자동 수집
  byT('nest').forEach(b=>{if(b.tier===2&&b.st.eggs.length){b.st.eggs.forEach(br=>{S.eggs.push(br);S.res.egg++;cnt('egg');});add('egg',0,bCenter(b),1.4,'+'+b.st.eggs.length+' 🥚');b.st.eggs=[];}nestVis(b);});
  if(S.clock>=24*60){banner('너무 늦었어요. 집으로 가서 자요');goSleep();}}
let stallT=10;
function duckName(d){return d.hero?(S.duckName||'대장 오리'):BREED[d.b].n;}
function layEgg(d){S.today.laid++;const nests=byT('nest').filter(b=>b.st.eggs.length<CAT.nest.slots[b.tier]);const r=ducks.find(x=>x.d===d);
  if(nests.length){let best=nests[0],bd=1e9;nests.forEach(b=>{const c=bCenter(b),dd=r?Math.hypot(c.x-r.x,c.z-r.z):0;if(dd<bd){bd=dd;best=b;}});best.st.eggs.push(d.b);if(r){const c=bCenter(best);r.act={x:c.x,z:c.z+0.2,t:4,pose:'sit'};}}
  else if(r){spawnPickup('egg',r.x,r.z,d.b);if(!S.seen.noNest){S.seen.noNest=1;banner('알이 풀밭에 떨어졌어요! 둥지를 지어 주면 둥지에 낳아요');}}
  if(!S.seen.firstEgg){S.seen.firstEgg=1;setTimeout(()=>fact('첫 알!','<p>'+josa(duckName(d),'이','가')+' 알을 낳았어요. 가까이 가면 주울 수 있어요.</p><p class="fact">알은 암컷 오리가 낳아요. 알을 잘 낳는 오리는 알 낳는 철에 거의 매일 하나씩 낳기도 해요. 수컷이 함께 지내야 품었을 때 새끼가 되는 알(유정란)이 생겨요.</p>'),400);}}
function hatch(b,c){const sex=Math.random()<0.5?'f':'m';const d=newDuck(b,sex,0);const r=ducks.find(x=>x.d===d);r.x=c.x;r.z=c.z+1;S.today.hatched++;cnt('hatch');lvl();burst(c.x,1,c.z,'❤️');banner('삐약! '+BREED[b].n+' 아기 오리('+(sex==='f'?'암컷':'수컷')+')가 태어났어요');
  if(!S.seen.hatch){S.seen.hatch=1;fact('아기 오리 탄생','<p class="fact">실제 집오리 알은 약 <b>28일</b> 동안 따뜻하게 품어야 부화해요(머스코비는 약 35일). 게임에서는 몇십 초로 줄였어요.</p>');}}

function updPops(dt){pops=pops.filter(o=>{o.t+=dt;o.s.position.y+=dt*1.1;o.s.material.opacity=clamp(1.4-o.t,0,1);if(o.t>1.4){scene.remove(o.s);o.s.material.map.dispose();o.s.material.dispose();return false;}return true;});}
function cnt(k,n){S.cnt[k]=(S.cnt[k]||0)+(n||1);}
function canPay(c){return Object.keys(c).every(k=>(S.res[k]||0)>=c[k]);}
function pay(c){Object.keys(c).forEach(k=>{S.res[k]-=c[k];bump(k);});}
function costHTML(c){const ks=Object.keys(c),lack=ks.filter(k=>(S.res[k]||0)<c[k]&&k!=='coin');return '<div class="cost">'+ks.map(k=>'<span class="'+((S.res[k]||0)<c[k]?'lack':'')+'">'+RES[k][0]+' '+(k==='coin'?'':RES[k][1]+' ')+c[k]+'</span>').join('')+'</div>'+(lack.length?'<span class="d" style="color:#C0392B">모자라요: '+lack.map(k=>RES[k][1]+' → '+WHERE[k].split(' · ')[0]).join(' / ')+'</span>':'');}

function say(t){try{if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;bgmDuck=0.25;u.onend=u.onerror=()=>{bgmDuck=1;};setTimeout(()=>{bgmDuck=1;},6000);speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
function norm(t){return String(t).toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();}
function parseHW(text){const out=[];let g=0,title='';text.split(/\n+/).forEach(l=>{l=l.trim();if(!l)return;if(l.startsWith('#')){g++;title=l.replace(/^#+\s*/,'');return;}
  let type='word';const pm=l.match(/^(고르기|빈칸|쓰기|단어)\s*[:：]\s*/);if(pm){type={'고르기':'choose','빈칸':'blank','쓰기':'write','단어':'word'}[pm[1]];l=l.slice(pm[0].length);}
  let k=l.indexOf(' = ');if(k<0)k=l.search(/[^<>]=(?!=)/)+1||l.indexOf('=');let a,b;if(k>0&&l[k]===' ')k=k+1;if(k>=0){a=l.slice(0,k).trim();b=l.slice(k+1).trim();}else{const t=l.split('\t');if(t.length<2)return;a=t[0].trim();b=t.slice(1).join(' ').trim();}if(!a||!b)return;
  if(type==='word'){if(!/[a-z]/i.test(a)&&/[a-z]/i.test(b)){const t=a;a=b;b=t;}out.push({type,en:a,ko:b,g,title});}else out.push({type,q:a,a:b,g,title});});return out;}
function itype(it){return it.type||'word';}
function serHW(items){let g=-1,out=[];items.forEach(it=>{if(it.g!==g&&it.title){out.push('# '+it.title);}g=it.g;const t=itype(it);out.push(t==='word'?it.en+' = '+it.ko:({choose:'고르기',blank:'빈칸',write:'쓰기'})[t]+': '+it.q+' = '+it.a);});return out.join('\n');}
function rule(a){let two=false;a=String(a).trim();if(/\s*x2$/i.test(a)){two=true;a=a.replace(/\s*x2$/i,'');}const c=a.replace(/\s/g,'');
  let m=c.match(/^(-?[\d.]+)(<=|<)x(<=|<)(-?[\d.]+)$/);if(m)return{two,range:[+m[1],m[2]==='<=',+m[4],m[3]==='<=']};
  m=c.match(/^(-?[\d.]+)~(-?[\d.]+)$/);if(m)return{two,range:[+m[1],true,+m[2],false]};return{two,alts:a.split('|').map(x=>x.trim()).filter(Boolean)};}
const isNum=v=>/^-?\d*\.?\d+$/.test(String(v).replace(/\s/g,''));
function okVal(r,v){v=String(v).trim();if(!v)return false;if(r.range){if(!isNum(v))return false;const x=parseFloat(v),[lo,li,hi,hc]=r.range;return (li?x>=lo:x>lo)&&(hc?x<=hi:x<hi);}
  return r.alts.some(a=>isNum(a)&&isNum(v)?parseFloat(a)===parseFloat(v):norm(a)===norm(v));}
function decs(n){const t=String(n);return t.includes('.')?t.split('.')[1].length:0;}
function example(r,k){const[lo,,hi]=r.range;const d=Math.max(decs(lo),decs(hi))+1;let x=+(lo+(hi-lo)*(k?0.7:0.3)).toFixed(d);if(!okVal(r,x))x=+(lo+(hi-lo)/2).toFixed(d+1);return x;}
function ansText(it){const t=itype(it);if(t==='word')return it.en+' = '+it.ko;if(t!=='write')return it.a;const r=rule(it.a);if(r.range){const[lo,li,hi,hc]=r.range;return lo+(li?' 이상 ':'보다 크고 ')+hi+(hc?' 이하':'보다 작은 수')+(r.two?' 2개':'')+' (예: '+example(r,0)+(r.two?', '+example(r,1):'')+')';}return r.alts.join(' 또는 ');}
