<meta charset="utf-8">
<title>오리 농장</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 한 화면 3D 농장: 위 자원·상태 줄, 왼쪽 목표, 왼쪽 아래 조이스틱, 오른쪽 아래 점프·줄서·짓기 */
[hidden]{display:none!important}
:root{
  --ink:#1F2A33; --muted:#5C6B75; --glass:rgba(255,255,255,.9); --dark:rgba(24,28,32,.72);
  --yellow:#FFD23F; --green:#3DBA54; --red:#E5483B; --blue:#2D8CE6; --line:#E3E6EA;
  --font:"Jua","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden;background:#8FCBF0;color:var(--ink);font-family:var(--font);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,.chip,.btn,.hud,.bar,.acts,#acts{touch-action:manipulation}#acts .btn,.joy{touch-action:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;gap:6px;
  padding:max(8px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.bar{display:flex;gap:6px;align-items:center}
.res{pointer-events:auto;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.res::-webkit-scrollbar{display:none}
.chip{pointer-events:auto;flex:none;display:flex;align-items:center;gap:4px;background:var(--glass);border-radius:999px;padding:4px 10px;font-size:15px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.12);font-variant-numeric:tabular-nums;transition:transform .15s}
.chip.bump{transform:scale(1.18)}
.chip.dark{background:var(--dark);color:#fff;box-shadow:none}
.chip.warn{background:#FFE0DC;color:#B42318}
.chip.warn.foe{background:#E5483B;color:#fff;font-weight:700;animation:pulse .7s ease-in-out infinite}
.foeedge{position:fixed;inset:0;pointer-events:none;z-index:4}.foeedge.on{animation:foeflash .9s ease-in-out 3}
@keyframes foeflash{50%{box-shadow:inset 0 0 90px 34px rgba(255,40,40,.6)}}
.foearrow{position:fixed;left:0;top:0;z-index:6;pointer-events:none;width:62px;height:62px;margin:-31px 0 0 -31px;display:none;align-items:center;justify-content:center;border-radius:50%;background:rgba(229,72,59,.95);font-size:30px;box-shadow:0 0 0 4px #fff,0 4px 14px rgba(0,0,0,.35)}
.foearrow .tip{position:absolute;left:50%;top:50%;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-bottom:20px solid #E5483B;margin:-10px 0 0 -13px;transform-origin:13px 10px}
body.inroom .foearrow{display:none!important}
button.chip{border:0;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.status{display:flex;gap:6px;flex-wrap:wrap}
.quest{pointer-events:auto;align-self:flex-start;background:var(--dark);color:#fff;border-radius:12px;padding:7px 11px;max-width:min(330px,70vw);font-size:14px;line-height:1.35;
  border-left:5px solid var(--yellow)}
.quest .t{font-size:11.5px;color:#FFE38A;letter-spacing:.04em}
.quest .p{display:flex;justify-content:space-between;gap:8px;margin-top:3px;font-size:12.5px;color:#D6DCE0}
.banner{align-self:center;background:#fff;font-size:18px;padding:7px 18px;border-radius:999px;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);max-width:92%;text-align:center;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.spacer{flex:1}
.bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.joy{pointer-events:auto;width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.75);position:relative;touch-action:none;flex:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.acts .row{display:flex;gap:8px;align-items:flex-end}
.btn{pointer-events:auto;font-family:var(--font);border:0;cursor:pointer;color:var(--ink);background:var(--glass);box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:focus-visible,.mbtns button:focus-visible,button.chip:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn.s{width:60px;height:60px;border-radius:18px;font-size:12px}
.btn.s .e{font-size:22px}
.btn.jump{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:14px}
.btn.jump .e{font-size:30px}
.btn.on{background:var(--yellow)}
.btn.big{min-width:150px;height:64px;border-radius:18px;font-size:17px;background:var(--yellow);padding:0 16px}
.btn.big.no{background:#E4E6E8;color:var(--muted)}
.btn.shoo{min-width:120px;height:64px;border-radius:18px;font-size:16px;background:#FF9F6B;color:#fff;padding:0 14px}
.btn.gun{width:84px;height:84px;border-radius:50%;background:#3AA0E6;color:#fff;font-size:13px;touch-action:none}.btn.gun .e{font-size:28px}
.btn.pulse{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.modal{position:fixed;inset:0;background:rgba(15,20,25,.5);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:16px max(14px,env(safe-area-inset-right,0px)) 16px max(14px,env(safe-area-inset-left,0px))}
.card{background:#fff;border-radius:20px;max-width:480px;width:100%;max-height:86vh;overflow:auto;padding:18px 18px 14px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5);animation:rise .2s ease-out;
  font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;-webkit-user-select:none;user-select:none}
*{-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.card h2{font-family:var(--font);font-weight:400;font-size:24px;margin:0 0 6px;text-wrap:balance}
.card h3{font-family:var(--font);font-weight:400;font-size:17px;margin:12px 0 4px}
.card p{margin:6px 0}
.card .eyebrow{font-family:var(--font);font-size:13px;color:var(--blue)}
.card .note{background:#EEF6FD;border-radius:12px;padding:9px 12px;font-size:14px}
.card .fact{background:#FFF7DA;border-radius:12px;padding:9px 12px;font-size:14px}
.card .src{font-size:12.5px;color:var(--muted)}
.card ul{padding-left:18px;margin:6px 0}
.card textarea{width:100%;box-sizing:border-box;min-height:150px;font:inherit;font-size:15px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;margin:4px 0;resize:vertical}
.card input[type=number],.card input[type=password]{font:inherit;font-size:18px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:140px}
.tabs{display:flex;gap:6px;margin:8px 0 2px;flex-wrap:wrap}
.tabs button{font-family:var(--font);font-size:15px;border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow)}
.item .big{font-size:30px;line-height:1}
.item .ok{font-size:12px;color:#1F7A35}
.bag{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:center;font-size:14px}
.bag .e{font-size:22px}.bag b{font-variant-numeric:tabular-nums}.bag .w{color:var(--muted);font-size:12.5px}
.qword{font-family:var(--font);font-size:38px;text-align:center;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.say{font-size:22px;border:2px solid var(--line);background:#fff;border-radius:999px;width:46px;height:46px;cursor:pointer}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.qopts button{font-family:var(--font);font-size:18px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;cursor:pointer;color:var(--ink)}
.qopts button.right{background:#DDF5E2;border-color:#3DBA54}.qopts button.wrong{background:#FFE0DC;border-color:#E5483B}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;min-height:44px}
.tiles button{font-size:17px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;cursor:pointer;font-family:system-ui,sans-serif}
.tiles.ans{background:#F4F6F8;border-radius:12px;padding:6px}
.qbar{height:8px;background:#EEF0F2;border-radius:9px;overflow:hidden;margin:4px 0 2px}.qbar i{display:block;height:100%;background:var(--green)}
.qtext{font-size:18px;line-height:1.5;margin:8px 0;background:#F7F9FB;border-radius:12px;padding:10px 12px}
.qtext .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue);font-weight:700}
.qins{display:flex;gap:8px;flex-wrap:wrap}.qins input{flex:1 1 120px}
.res-ok{color:#1F7A35;font-weight:700}.res-no{color:#B42318;font-weight:700}
button.chip.hw{background:var(--yellow)}
.card input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-size:18px;padding:9px 12px;border:2px solid var(--line);border-radius:12px;margin:4px 0}
.card input[type=text]:focus{outline:none;border-color:var(--blue)}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.opts button{font:inherit;font-size:14px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;cursor:pointer}
.opts button[aria-pressed=true]{border-color:var(--ink);background:#F4F6F8}
.sw{width:38px;height:38px;border-radius:50%!important;padding:0!important}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.item{border:2px solid var(--line);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.item:disabled{cursor:default;opacity:.55}
.plan .joy{display:none!important}
.item.armed{border-color:#F2B632;background:#FFF6D6;box-shadow:0 0 0 3px rgba(242,182,50,.35)}.tabs [aria-pressed="true"]{background:#FFD23F;border-color:#F2B632}.item .cf{font-size:12.5px;font-weight:700;color:#B5730B}
.item .n{font-family:var(--font);font-size:16px}
.item .d{font-size:12.5px;color:var(--muted);line-height:1.35}
.cost{display:flex;flex-wrap:wrap;gap:4px;font-size:12.5px}
.cost span{background:#F1F3F5;border-radius:999px;padding:1px 7px}
.cost span.lack{background:#FFE0DC;color:#B42318}
.stat{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:14px;margin:6px 0}
.stat b{font-weight:600}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.mbtns button{flex:1 1 auto;font-family:var(--font);font-size:16px;border-radius:12px;padding:10px 14px;cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink)}
.mbtns button.primary{background:var(--yellow);border-color:var(--yellow)}
.mbtns button:disabled{opacity:.45;cursor:default}
.mbtns button.danger{color:var(--red);border-color:#F5C2BC}
.fbar{position:relative;height:36px;background:#DDEFF7;border-radius:10px;margin:14px 0;overflow:hidden}.fbar i{position:absolute;top:0;bottom:0;background:#7ED957}.fbar b{position:absolute;top:-2px;bottom:-2px;width:7px;background:#E5483B;border-radius:3px;left:0}
.runt{position:fixed;top:118px;left:50%;transform:translateX(-50%);z-index:6;display:none;background:rgba(30,35,45,.85);color:#FFE38A;font:700 22px system-ui,sans-serif;padding:6px 16px;border-radius:14px;pointer-events:none}
.fade{position:fixed;inset:0;background:#0E1730;opacity:0;pointer-events:none;transition:opacity .8s;z-index:15;display:flex;align-items:center;justify-content:center;color:#FFF3C4;font-family:var(--font);font-size:32px}
.fade.on{opacity:1;pointer-events:auto}
.mini{position:fixed;right:max(10px,env(safe-area-inset-right,0px));top:calc(max(8px,env(safe-area-inset-top,0px)) + 46px);width:112px;height:112px;border-radius:14px;background:rgba(20,28,34,.55);
  box-shadow:0 2px 10px -4px rgba(0,0,0,.4);pointer-events:auto;cursor:pointer;border:2px solid rgba(255,255,255,.7)}
.bigmap{width:100%;max-width:420px;aspect-ratio:1;border-radius:16px;display:block;margin:6px auto;background:#1E2A30}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
body.inroom .status,body.inroom .quest,body.inroom .mini,body.inroom .joy{display:none!important} body.inroom.roomwalk .joy{display:block!important}
.alarm{text-align:center}.alarm .big{font-size:64px;line-height:1;margin:6px 0;animation:pulse 1s ease-in-out infinite}
.rlist li{margin:6px 0}.rlist .src{display:block}
@media (max-width:430px){.mini{width:92px;height:92px}.chip{font-size:13px;padding:3px 8px}.joy{width:108px;height:108px}.btn.s{width:54px;height:54px}.btn.jump,.btn.gun{width:76px;height:76px}.quest{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="cv" tabindex="0" aria-label="오리 농장 화면"></canvas>
<div class="hud">
  <div class="bar"><span class="chip" id="buffChip" style="display:none"></span><span class="chip dark" id="hDay">1일째 07:00</span><div class="res" id="res"></div><button class="chip" id="bAv" aria-label="내 옷장">👗</button><button class="chip" id="bBag" aria-label="가방">🎒</button><button class="chip" id="bVoc" aria-label="내 단어장">📖</button><button class="chip" id="bHw" aria-label="숙제">📚</button><button class="chip" id="bPlan" aria-label="계획 모드">🗺️</button><button class="chip" id="bMkt" aria-label="시세판">📈</button><button class="chip" id="bTown" aria-label="마을 관리">🏘️</button><span class="chip" id="engChip" title="영어 이야기 연속">📘 0일</span><button class="chip" id="bShop" aria-label="상점">🛒</button><button class="chip" id="bDex" aria-label="오리 도감">📒</button><button class="chip" id="bMenu" aria-label="메뉴">☰</button></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){document.body.innerHTML='<p style="padding:20px;font-family:sans-serif">3D 엔진을 불러오지 못했어요. 새로고침해 주세요.</p>';return;}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
const C=h=>new THREE.Color(h).convertSRGBToLinear();
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function batchim(s){const c=s.charCodeAt(s.length-1);if(c<0xAC00||c>0xD7A3)return false;return (c-0xAC00)%28!==0;}
function josa(s,a,b){return s+(batchim(s)?a:b);}
const FAST=clamp(+(new URLSearchParams(location.search).get('fast')||1),1,40);

/* ================= 저장 ================= */
// 🔍 부모님 미리보기(preview.html): 저장 공간을 따로 써서 아이 저장·가족 클라우드와 섞이지 않아요
const PREVIEW=/preview\.html$/.test(location.pathname)||new URLSearchParams(location.search).has('preview');
const KEYBASE=PREVIEW?'duck-farm-preview':'duck-farm-v1';
// 👪 가족 플레이어: 아이(kid)·엄마(mom)·아빠(dad)가 각자 농장을 따로 키워요. 🏡 방문 모드(?visit=mom)는 상대 농장을 구경만 해요(저장 안 함)
const WHO=(()=>{try{const w=localStorage.getItem(KEYBASE+'-who');return w==='mom'||w==='dad'?w:'kid';}catch(e){return 'kid';}})();
const WHON={kid:'아이',mom:'엄마',dad:'아빠'},WHOE={kid:'👧',mom:'👩',dad:'👨'};
const VISIT=(()=>{const v=new URLSearchParams(location.search).get('visit');return v==='kid'||v==='mom'||v==='dad'?v:null;})();
const KEY=KEYBASE+(WHO==='kid'?'':'-'+WHO);const SAVEDOC=WHO==='kid'?'save/main':'save/'+WHO;const saveDocOf=w=>w==='kid'?'save/main':'save/'+w;
function INIT_PLOTS(){const a=[];for(let x=1;x<=4;x++)for(let z=1;z<=4;z++)a.push(x+','+z);return a;}
const DEF=()=>({v:1,started:false,girl:'',hair:'pig',hairC:'#4A2E22',dress:'#FF7FA8',day:1,clock:7*60,
  res:{coin:100,grain:0,straw:6,feed:40,egg:0,twig:4,rock:4,feather:2,weed:0,gem:0},eggs:[],bld:[],ducks:[],q:0,seen:{},cnt:{},dex:{pekin:1},nid:1,
  autoSell:true,clean:100,g24:true,plots:INIT_PLOTS(),shoo:0,gun:0,gunW:0,lastSeason:0,today:{laid:0,sold:0,coins:0,hatched:0,feed:0},unlock:{runner:false,call:false,muscovy:false},paraded:0});
function load(){if(VISIT){try{const v=sessionStorage.getItem(KEYBASE+'-visit');if(v){const o=JSON.parse(v);const d=DEF();Object.assign(d,o);d.res=Object.assign(DEF().res,o.res);return d;}}catch(e){}}try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.v===1){if(!o.g24){(o.bld||[]).forEach(b=>{b.i+=4;b.j+=4;});o.g24=true;o.plots=INIT_PLOTS();}const d=DEF();Object.assign(d,o);d.res=Object.assign(DEF().res,o.res);return d;}}}catch(e){}return DEF();}
/* 💦 물총: 0=없음, 1~4단계 (상점에서 사고 업그레이드) */
const GUNS=[null,
 {n:'꼬마 물총',e:'💧',col:'#3AA0E6',tank:'#FFD23F',dmg:1,rng:8,cd:0.45,cap:15,shots:1,c:{coin:40}},
 {n:'쌍둥이 물총',e:'💦',col:'#2FBF8F',tank:'#7BD389',dmg:1,rng:9,cd:0.36,cap:24,shots:2,c:{coin:120,twig:10}},
 {n:'펌프 물대포',e:'🌊',col:'#2F6FE0',tank:'#FF8A3D',dmg:2,rng:11,cd:0.3,cap:34,shots:2,c:{coin:250,rock:15,gem:2}},

function plant(b,k){if(sIdx()===3){banner('겨울에는 작물이 자라지 않아요. 봄을 기다려요');return;}if(!k){cropPick(k2=>plant(b,k2),1);return;}const cr=CROPS[k];if(S.res.coin<cr.seed){banner('씨앗 값이 모자라요');return;}S.res.coin-=cr.seed;bump('coin');b.st.crop=k;b.st.stage='grow';b.st.t=0;pop();line('Let\'s plant some seeds!','씨앗을 심자!');cnt('plant');cnt('crop_'+k);cropLook(b);save();}
function harvest(b){const c=CAT.field,k=b.st.crop||'wheat',cr=CROPS[k];if(k==='wheat'){add('grain',Math.round(c.yield[b.tier]*season().yield),bCenter(b),1.6);setTimeout(()=>add('straw',c.straw[b.tier],bCenter(b),2.3),250);}else{add(cr.r,Math.round(cr.amt*[1,1.6,2.5][b.tier]*season().yield),bCenter(b),1.6);cnt('h_'+k);}
  const again=b.tier>=1&&S.res.coin>=cr.seed&&sIdx()!==3;if(again){S.res.coin-=cr.seed;}b.st.stage=again?'grow':'empty';b.st.t=0;cnt('harvest');pop();SFX.whoosh();if(k==='wheat')line('Harvest time! Look at all this wheat!','수확할 시간! 밀이 이렇게 많아!');else line('What a great harvest!','풍년이에요!');cropLook(b);}
function upgrade(b){const c=CAT[b.t].cost[b.tier+1];if(!canPay(c))return;pay(c);b.tier++;spawnB(b);if(b.t==='nest')bldR.get(b.id).R.n=-1;lvl();const cc=bCenter(b);burst(cc.x,2.5,cc.z,'⬆ LEVEL UP!');cnt('up');if(b.tier===2)cnt('tier3');banner(CAT[b.t].n[b.tier]+'(으)로 업그레이드!');save();}
// 귀한 품종 알을 먼저 품어요(콜덕 → 머스코비 → 러너 → 그 밖 → 페킨). 품종을 골라 넣을 수도 있어요.
const EGG_PRI=['call','goose','muscovy','runner'];const eggPri=b=>{const i=EGG_PRI.indexOf(b);return i<0?(b==='pekin'?9:5):i;};
const fertileSet=()=>new Set(S.ducks.filter(d=>d.sex==='m'&&d.age>=150).map(d=>d.b));
function eggCounts(){const m={};S.eggs.forEach(e=>m[e]=(m[e]||0)+1);return m;}
function incubate(b,want){if(S.res.egg<1)return;const males=fertileSet();let i=-1;
  if(want)i=S.eggs.findIndex(e=>e===want&&males.has(e));else{let best=99;S.eggs.forEach((e,k)=>{if(males.has(e)&&eggPri(e)<best){best=eggPri(e);i=k;}});}
  if(i<0){if(!S.seen.infertile){S.seen.infertile=1;}fact('알이 깨어나지 않아요','<p class="fact">수컷 오리가 함께 지내야 품었을 때 새끼가 되는 알(유정란)이 생겨요. 지금 창고 알과 같은 품종의 다 큰 수컷이 농장에 없어요.</p>');return;}
  const br=S.eggs.splice(i,1)[0];S.res.egg--;b.st.eggs.push({b:br,t:0});cnt('incub');pop();banner(BREED[br].n+' 알을 넣었어요. 따뜻하게 품는 중…');}

  const show=()=>modal('<p class="eyebrow">☁️ 저장된 게임</p><h2>이어서 할까요?</h2><p><b>'+esc(d.girl||'')+'</b> · '+d.day+'일째 · 오리 '+d.ducks+'마리<br><span class="src">다른 기기에서 '+new Date(d.at).toLocaleString('ko-KR')+'에 저장했어요.</span></p>'+(fresh?'':'<p class="note">이 기기의 게임('+S.day+'일째)보다 더 진행된 저장이에요.</p>'),
    [{t:'▶️ 이어서 하기',cls:'primary',fn:go},{t:fresh?'새로 시작하기':'이 기기 게임 계속',fn:()=>{if(fresh)welcome();}}]);
  if(modalOpen){closeModal(true);mq.length=0;}show();}catch(e){}})();
})();
</script>
